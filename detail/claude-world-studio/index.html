1. create_notebook(title=\"Post Visual\", text_sources=[\"\u003Cpost content + key data points>\"])\n2. generate_artifact(name_or_id, \"slides\", lang=\"zh-TW\")   → PDF slides (best for cards)\n3. download_artifact(name_or_id, \"slides\", \"downloads/card.pdf\")\n`",firstFile:{name:"projects/claude-world-studio/docs/content-pipeline-skill.md",start:135,end:163,startLoc:{line:135,column:1,position:1426},endLoc:{line:163,column:8,position:1725}},secondFile:{name:"projects/claude-world-studio/.claude/skills/content-pipeline/SKILL.md",start:88,end:116,startLoc:{line:88,column:1,position:980},endLoc:{line:116,column:6,position:1279}},firstFileStart:{},secondFileStart:{}},{format:"markdown",lines:20,tokens:0,fragment:"### Video (影片)\n\nCombine slides + podcast audio into MP4:\n\n1. `generate_artifact(name_or_id, \"slides\")` → PDF\n2. `generate_artifact(name_or_id, \"podcast\")` → M4A audio (run sequentially, NOT parallel)\n3. Download both artifacts\n4. `pdftoppm -png -r 300 slides.pdf slides_page`\n5. `ffmpeg -framerate 1/$per_slide -pattern_type glob -i 'slides_page-*.png' -i audio.mp3 -c:v libx264 -pix_fmt yuv420p -c:a",firstFile:{name:"projects/claude-world-studio/docs/content-pipeline-skill.md",start:166,end:185,startLoc:{line:166,column:1,position:1746},endLoc:{line:185,column:29,position:1926}},secondFile:{name:"projects/claude-world-studio/.claude/skills/content-pipeline/SKILL.md",start:132,end:151,startLoc:{line:132,column:1,position:1476},endLoc:{line:151,column:29,position:1656}},firstFileStart:{},secondFileStart:{}},{format:"markdown",lines:56,tokens:0,fragment:"### 1. Read Original Sources\n\nNEVER write content based on titles/metadata alone.\n\n- Single topic: read >= 1 primary source via browser_markdown(url)\n- Controversial: read >= 2 sources (both sides)\n- Data claims: find original data source\n\n### 2. Timeline Verification\n\nEvery fact must have a verified timestamp. Discard anything > 48 hours old.\n\n| Source age | Allowed                    |
